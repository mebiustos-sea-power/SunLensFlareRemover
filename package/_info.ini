[Language_en]
Name=Sun Lens Flare Remover
Description=Removes the sun lens flare, including star-shaped rays and lens ghosts. Preserves the sun disc, sky lighting, sunset colors, sea reflections, and moon flare. Requires Anchor Chain. Enable this mod and restart Sea Power.

[Language_ja]
Name=Sun Lens Flare Remover
Description=太陽のレンズフレア（星状の光芒やレンズ内の反射像）を無効化します。太陽本体、空の照明、夕焼け、海面の反射、月のフレアは維持します。Anchor Chainが必要です。有効にした後、Sea Powerを再起動してください。
